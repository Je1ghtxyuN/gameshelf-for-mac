<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>GameShelf administration</title><link rel="stylesheet" href="/admin.css"><script src="/admin.js" defer></script></head>
<body><main><header><h1>GameShelf</h1></header>
<p id="message" role="status" aria-live="polite"></p>
<form id="login"><h2>Sign in · 登录</h2><label>Username 用户名<input name="username" autocomplete="username" required></label><label>Password 密码<input name="password" type="password" autocomplete="current-password" required></label><button>Sign in 登录</button></form>
<form id="setup" hidden><h2>Set up library · 初始化共享库</h2><label>Private invitation 私有邀请<input name="invitation" type="file" accept="application/json,.json" required></label><label>Username 用户名<input name="username" autocomplete="username" required></label><label>Password 密码<input name="password" type="password" minlength="12" autocomplete="new-password" required></label><label>Confirm password 确认密码<input name="confirmation" type="password" minlength="12" autocomplete="new-password" required></label><button>Create administrator 创建管理员</button></form>
<div id="admin" hidden><nav><span id="account"></span><button id="download-invitation" type="button">Download invitation 下载邀请</button><button id="refresh">Refresh 刷新</button><button id="logout">Sign out 退出</button></nav>
<section><h2>1. Sources · 只读源</h2><form id="root-form"><label>Name 名称<input name="title" required></label><label>Container source path 容器内路径<input name="path" placeholder="/sources/library" required></label><button>Add source 添加源</button></form><div id="roots"></div></section>
<section><h2>2. Select and publish · 勾选发布</h2><div id="candidates"></div><button id="publish">Publish selected 发布所选</button></section>
<section><h2>3. Accounts · 账号</h2><form id="user-form"><label>Username 用户名<input name="username" autocomplete="off" required></label><label>New password 新密码<input name="password" type="password" minlength="12" autocomplete="new-password" required></label><label class="check"><input name="admin" type="checkbox">Administrator 管理员</label><button>Create account 创建账号</button></form><div id="users"></div></section>
<section><h2>4. Game grants · 游戏授权</h2><form id="grant-form"><label>Account 账号<select name="userID" required></select></label><label>Published game 已发布游戏<select name="gameID" required></select></label><button name="allow" value="true">Grant 授权</button><button name="allow" value="false">Revoke 撤销</button></form><div id="grants"></div></section>
<section><h2>Default covers · 默认封面</h2><div id="covers"></div></section>
</div></main></body></html>

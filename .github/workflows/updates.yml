name: Publish Sparkle update feed
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing latest stable release tag (retry after attaching DMG)
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: sparkle-stable-publish
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.repository == 'Je1ghtxyuN/gameshelf-for-mac' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.release.draft == false && github.event.release.prerelease == false))
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out trusted publishing code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned setup-python commit
        with:
          python-version: '3.12'
      - name: Install signature verification dependency
        run: python -m pip install cryptography==46.0.3
      - name: Validate release publisher
        run: python -m unittest discover -s Tests -p test_update_release.py -v
      - name: Sign and upload stable feed
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: python Tools/publish_appcast.py --tag "$RELEASE_TAG" --publish
